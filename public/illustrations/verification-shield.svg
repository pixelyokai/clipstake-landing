  <!-- shield block -->
  <g transform="translate(432.56 169.686)" filter="url(#f-block)">
    <rect x=".649" y=".65" width="225.598" height="225.598" rx="34.457" fill="url(#g12)" stroke="#fff" stroke-width="1.3"/>
    <rect x="13.652" y="13.653" width="199.592" height="199.592" rx="21.455" fill="#f69f9f" stroke="#ffe6e6" stroke-width=".65"/>
    <g transform="translate(16.902 17.554)" filter="url(#f-tile)">
