        <use href="#shield" fill="url(#g21)"/>
        <use href="#shield" fill="url(#g20)"/>
        <use href="#shield" fill="url(#g22)"/>
        <!-- inner rim -->
        <use href="#shield" transform="translate(8.5 8.5) scale(.881)" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/>
