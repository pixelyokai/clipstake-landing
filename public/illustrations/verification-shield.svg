    </g>
    <g transform="translate(18.203 18.854)">
      <use href="#tile" fill="url(#g16)"/>
      <use href="#tile" fill="url(#g17)"/>
      <g transform="translate(23.788 27.142)">
        <!-- soft red ground shadow, then the glowing rim -->
        <use href="#shield" fill="#c40008" filter="url(#f-shield-drop)" opacity=".9"/>
        <use href="#shield" fill="url(#g19)" stroke="#fff" stroke-width="2.6" filter="url(#f-shield)"/>
